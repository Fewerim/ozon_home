syntax = "proto3";

package google.api;

option cc_enable_arenas = true;
option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";
option java_multiple_files = true;
option java_outer_classname = "HttpProto";
option java_package = "com.google.api";
option objc_class_prefix = "GAPI";

// Defines the HTTP configuration for an API service. It contains a list of
// [HttpRule][google.api.HttpRule], each specifying the mapping of an RPC method
// to one or more HTTP REST API methods.
message Http {
  // A list of HTTP configuration rules that apply to individual API methods.
  //
  // **NOTE:** All service configuration rules follow "last one wins" order.
  repeated HttpRule rules = 1;

  // When set to true, URL path parameters will be fully URI-decoded except in
  // cases of single segment matches in reserved expansion, where "%2F" will be
  // left encoded.
  //
  // The default behavior is to not decode RFC 6570 reserved characters in multi
  // segment matches.
  bool fully_decode_reserved_expansion = 2;
}

// gRPC Transcoding
//
// `HttpRule` defines the schema of the gRPC/REST mapping. The mapping specifies
// how different portions of the gRPC request message are mapped to the URL
// path, URL query parameters, and HTTP request body. It also controls how the
// gRPC response message is mapped to the HTTP response body.
//
// `HttpRule` is typically specified as an `google.api.http` annotation on the
// gRPC method.
//
// Each mapping specifies a URL path template and an HTTP method. The path
// template may refer to one or more fields in the gRPC request message, as long
// as each field is a non-repeated field with a primitive (non-message) type.
// The path template controls how fields of the request message are mapped to
// the URL path.
//
// Example:
//
//     service Messaging {
//       rpc GetMessage(GetMessageRequest) returns (Message) {
//         option (google.api.http) = {
//             get: "/v1/{name=messages/*}"
//         };
//       }
//     }
//     message GetMessageRequest {
//       string name = 1; // Mapped to URL path.
//     }
//     message Message {
//       string text = 1; // The resource content.
//     }
//
// This enables an HTTP REST to gRPC mapping as shown below:
//
// HTTP | gRPC
// -----|-----
// `GET /v1/messages/123456`  | `GetMessage(name: "messages/123456")`
//
// Any fields in the request message which are not bound to the request path or
// the request body automatically become HTTP query parameters.
//
// Assume there is a service with the following method:
//
//     service Messaging {
//       rpc GetMessage(GetMessageRequest) returns (Message) {
//         option (google.api.http) = {
//             get:"/v1/messages/{message_id}"
//         };
//       }
//     }
//     message GetMessageRequest {
//       string message_id = 1; // Mapped to URL path.
//       int64 revision = 2;    // Mapped to URL query parameter `revision`.
//       string sub = 3;        // Mapped to URL query parameter `sub.sub`.
//     }
//
// This enables an HTTP REST to gRPC mapping as shown below:
//
// HTTP | gRPC
// -----|-----
// `GET /v1/messages/123456?revision=2&sub.sub=foo` |
//      `GetMessage(message_id: "123456" revision: 2 sub: SubMessage(sub: "foo"))`
//
// Note that fields which are mapped to URL query parameters must have a
// primitive type or a repeated primitive type or a non-repeated message type.
// In the case of a repeated type, the parameter can be repeated in the URL
// as `...?param=A&param=B`. In the case of a message type, each field of the
// message is mapped to a separate parameter, such as
// `...?foo.a=A&foo.b=B&foo.c=C`.
//
// In order to allow more flexible URL mappings, you can use the following
// syntax:
//
//     /v1/{name=messages/*}
//
// By default, templates use the syntax shown above. To match a segment
// using RFC 6570 reserved expansion, use `**` for the variable part:
//
//     /v1/{name=messages/**}
//
// If the variable matches a path segment including the `/` character, use
// `**` instead of `*` in the template:
//
//     /v1/{name=messages/**}
//
// This enables an HTTP REST to gRPC mapping as shown below:
//
// HTTP | gRPC
// -----|-----
// `GET /v1/messages/foo/bar` | `GetMessage(name: "messages/foo/bar")`
//
// Note that `**` can only be used at the end of a path template. It is
// not possible to match a path segment containing `/` in the middle of a
// template.
//
// ### Using `additional_bindings`
//
// A single `HttpRule` can specify multiple REST mappings. This is useful when
// a single RPC needs to be exposed under multiple REST endpoints.
//
//     service Messaging {
//       rpc GetMessage(GetMessageRequest) returns (Message) {
//         option (google.api.http) = {
//           get: "/v1/messages/{message_id}"
//           additional_bindings {
//             get: "/v1/users/{user_id}/messages/{message_id}"
//           }
//         };
//       }
//     }
//
// This enables the following two alternative HTTP JSON to RPC mappings:
//
// HTTP | gRPC
// -----|-----
// `GET /v1/messages/123456` | `GetMessage(message_id: "123456")`
// `GET /v1/users/me/messages/123456` | `GetMessage(user_id: "me" message_id: "123456")`
//
// ## Rules for HTTP mapping
//
// 1. Leaf request fields (recursive expansion nested messages in the request
//    message) are classified into three categories:
//
//    - Fields referred by the HttpRule. These fields includes "Path Template"
//      Variables and HTTP Request Body.
//
//    - Fields recognized by the [system parameters][https://cloud.google.com/apis/docs/system-parameters].
//      These fields are not bound by the HttpRule.
//
//    - All fields not classified into the above two categories. These fields
//      become "Query parameters".
//
// 2. Percent-encoding and spaces
//
//    When a path template variable or a query parameter is percent-encoded,
//    the percent-encoded string is mapped into the corresponding field of the
//    request message. Percent-encoded strings are decoded when the field is a
//    string type.
//
//    When the `%2F` appears in a path template variable, the `%2F` is decoded
//    into the corresponding field of the request message. In this case, the
//    `%2F` is treated as a single `/` character.
//
//    All characters other than `%2F` are not decoded, e.g. `%20` is kept
//    as `%20`.
//
// 3. When a path template variable or a query parameter is mapped into a
//    field of the request message, the value is converted to the type of the
//    field. The conversion follows the standard proto3 JSON mapping rules.
//
// ### Path template syntax
//
//     Template = "/" Segments [ Verb ] ;
//     Segments = Segment { "/" Segment } ;
//     Segment  = "*" | "**" | LITERAL | Variable ;
//     Variable = "{" FieldPath [ "=" Segments ] "}" ;
//     FieldPath = IDENT { "." IDENT } ;
//     Verb     = ":" LITERAL ;
//
// The syntax `*` matches a single URL path segment. The syntax `**` matches
// zero or more URL path segments, which must be the last part of the URL path
// except the `Verb`.
//
// The syntax `Variable` matches part of the URL path as specified by its
// template. A variable template must not contain other variables. If a variable
// matches a single path segment, its template can be omitted, e.g. `{var}`
// is equivalent to `{var=*}`.
//
// If a variable contains a path template with more than one segment,
// e.g. `{var=prefix/*/suffix}`, then the variable is bound to the entire
// matched path including the `/` characters.
//
// The syntax `LITERAL` matches literal text in the URL path. A `LITERAL`
// cannot be the last part of the template.
//
// The syntax `Verb` matches one or more path segments after the last `/` in
// the URL path, terminated by the first `:` character in the path segment.
// This syntax is used to provide a fallback mapping for paths that contain
// a `:` character, such as Google API custom method names.
//
// Note: The `Verb` syntax is deprecated and should not be used in new
// mappings.
message HttpRule {
  // Selects a method to which this rule applies.
  //
  // Refer to [selector][google.api.DocumentationRule.selector] for syntax
  // details.
  string selector = 1;

  // Determines the URL pattern is matched by this rules. This pattern can be
  // used with any of the methods.
  oneof pattern {
    // Maps to HTTP GET. Used for listing and getting information about
    // resources.
    string get = 2;

    // Maps to HTTP PUT. Used for replacing a resource.
    string put = 3;

    // Maps to HTTP POST. Used for creating a resource or performing an action.
    string post = 4;

    // Maps to HTTP DELETE. Used for deleting a resource.
    string delete = 5;

    // Maps to HTTP PATCH. Used for updating a resource.
    string patch = 6;

    // The custom pattern is used for specifying an HTTP method that is not
    // included in the `pattern` field, such as `HEAD`, or `"*"`.
    CustomHttpPattern custom = 8;
  }

  // The name of the request field whose value is mapped to the HTTP request
  // body, or `*` for mapping all request fields not captured by the path
  // pattern to the HTTP body, or omitted for not having any HTTP request body.
  //
  // NOTE: the referred field must be present at the top-level of the request
  // message.
  string body = 7;

  // Optional. The name of the response field whose value is mapped to the HTTP
  // response body. When omitted, the entire response message will be used
  // as the HTTP response body.
  //
  // NOTE: The referred field must be present at the top-level of the response
  // message.
  string response_body = 12;

  // Additional HTTP bindings for the selector. Nested bindings must
  // not contain an `additional_bindings` field themselves (that is,
  // the nesting may only be one level deep).
  repeated HttpRule additional_bindings = 11;
}

// A custom pattern is used for defining custom HTTP verb.
message CustomHttpPattern {
  // The name of this custom HTTP verb.
  string kind = 1;

  // The path matched by this custom verb.
  string path = 2;
}
